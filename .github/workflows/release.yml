name: Release

# Builds, tests and publishes a GitHub Release for a version tag (v1.2.3, or v1.2.3-beta.1 for a
# pre-release). The release carries the app, checksums, and the exact upstream sources of the LGPL
# FFmpeg helper with the script that builds it (the "complete corresponding source").
#
# Hardening notes:
# - The FFmpeg helper is always built from source here. It is never restored from an Actions cache,
#   because ci.yml (which also runs for pull requests) fills caches and a poisoned entry would
#   otherwise be shipped inside the app.
# - Releases are created as DRAFTS for a human to review and publish. A published release is never
#   modified unless a manual run sets replace_assets=true.
# - The zip and the source bundle get a signed build-provenance attestation (gh attestation verify).
# - The runner image is pinned, so a new default image can't change the build unnoticed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.1.0"
        required: true
        type: string
      replace_assets:
        description: "Replace assets of an already PUBLISHED release (normally refused; drafts are always fine)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; the release job below adds only what it needs.
permissions:
  contents: read

jobs:
  release:
    # Pinned image instead of macos-latest: the toolchain (Xcode, clang, SDK) is part of the build,
    # so it must not change silently. Trade-off: GitHub retires old images, so this needs a manual
    # bump (and a fresh look at PKGCONF_VERSION) every so often, and it won't pick up a newer macOS
    # image until then. Update it deliberately, in its own commit.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write       # create the draft release and upload assets
      id-token: write       # OIDC token to sign the provenance attestations
      attestations: write   # store the attestations
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPLACE_ASSETS: ${{ inputs.replace_assets && 'true' || 'false' }}
      # pkg-config is only used by FFmpeg's configure to find the static libraries built just before
      # it. The build fails if the installed version differs, so a change is always noticed.
      PKGCONF_VERSION: "3.0.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      # Fail fast, before the long build, if this would touch an already published release.
      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "false" ] && [ "$REPLACE_ASSETS" != "true" ]; then
              echo "error: release $TAG is already published. Refusing to modify it." >&2
              echo "Re-run manually (workflow_dispatch) with replace_assets=true only if you really mean to replace its assets." >&2
              exit 1
            fi
          fi

      - name: Version
        id: version
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "error: '$TAG' is not a version tag (v1.2.3)" >&2; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          sw_vers
          xcodebuild -version
          swift --version

      # Always built fresh, from source tarballs the script checks against pinned SHA-256 sums.
      # Deliberately no cache: see the hardening notes at the top of this file.
      - name: Check pkg-config
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          have=$(pkg-config --version)
          echo "pkg-config $have"
          if [ "$have" != "$PKGCONF_VERSION" ]; then
            echo "error: pkg-config is $have but this workflow pins $PKGCONF_VERSION; review and update PKGCONF_VERSION" >&2
            exit 1
          fi

      - name: Build FFmpeg helper (LGPL)
        run: |
          ./scripts/build-ffmpeg.sh
          echo "ameya-ffmpeg sha256: $(shasum -a 256 .build-deps/ffmpeg/bin/ameya-ffmpeg)"

      # Re-verifies every tarball against the SHA-256 sums pinned in the script (downloading any
      # that are missing) and writes .build-deps/sources/SHA256SUMS.
      - name: Verify FFmpeg sources
        run: ./scripts/build-ffmpeg.sh --sources-only

      - name: Test
        run: swift test
        env:
          AMEYA_FFMPEG: ${{ github.workspace }}/.build-deps/ffmpeg/bin/ameya-ffmpeg

      - name: Build app bundle (universal)
        run: |
          ./scripts/build-app.sh
          test -x dist/Ameya.app/Contents/MacOS/ameya-ffmpeg || { echo "error: the release must include the FFmpeg helper" >&2; exit 1; }
          lipo -archs dist/Ameya.app/Contents/MacOS/Ameya | grep -q x86_64
          lipo -archs dist/Ameya.app/Contents/MacOS/Ameya | grep -q arm64

      - name: Self-test inside the sandbox
        run: dist/Ameya.app/Contents/MacOS/Ameya --self-test

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --keepParent dist/Ameya.app "release/Ameya-$VERSION.zip"

          # Complete corresponding source for ameya-ffmpeg: the untouched upstream tarballs, the
          # build script (configure options and the two small build fixes) and the licence texts.
          SOURCES="third-party-sources-$VERSION"
          STAGE="$RUNNER_TEMP/$SOURCES"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/upstream" "$STAGE/scripts"
          cp .build-deps/sources/*.tar.* .build-deps/sources/SHA256SUMS "$STAGE/upstream/"
          (cd "$STAGE/upstream" && shasum -a 256 -c SHA256SUMS)
          cp scripts/build-ffmpeg.sh "$STAGE/scripts/"
          cp THIRD_PARTY_NOTICES.md "$STAGE/"
          cp -R LICENSES "$STAGE/LICENSES"
          cat > "$STAGE/README.txt" <<EOF
          Source code for the FFmpeg helper (ameya-ffmpeg) in Ameya $VERSION.

          upstream/   The exact, unmodified source releases it was built from, with SHA-256 sums.
                      NASM is a build tool only; it is not part of the shipped binary.
          scripts/    build-ffmpeg.sh, which records every configure option and build fix.
                      Put it in a checkout of Ameya $TAG, copy upstream/* to .build-deps/sources/,
                      and run ./scripts/build-ffmpeg.sh to rebuild the helper.
          LICENSES/, THIRD_PARTY_NOTICES.md   Licences and notices.
          EOF
          COPYFILE_DISABLE=1 tar -czf "release/$SOURCES.tar.gz" -C "$RUNNER_TEMP" "$SOURCES"

          (cd release && shasum -a 256 "Ameya-$VERSION.zip" "$SOURCES.tar.gz" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/Ameya-*.zip
            release/third-party-sources-*.tar.gz

      # Creates a DRAFT; a human reviews it and publishes it from the Releases page.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Runs entirely on your Mac. Ad-hoc signed, not notarized yet: first launch via right-click → Open; see the [README](https://github.com/sahilxnahar/project-ameya#install).

          Check a download against `SHA256SUMS.txt`, and verify where it was built with `gh attestation verify Ameya-<version>.zip --repo sahilxnahar/project-ameya` (see the README).

          `third-party-sources-*.tar.gz` holds the exact source of the bundled LGPL FFmpeg helper and the script that builds it.

          TODO (needs an Apple Developer account): sign with a Developer ID certificate and notarize, so macOS opens the app without the first-launch workaround.
          EOF
          set -- release/Ameya-"$VERSION".zip release/third-party-sources-"$VERSION".tar.gz release/SHA256SUMS.txt
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "false" ]; then
              if [ "$REPLACE_ASSETS" != "true" ]; then
                echo "error: release $TAG is already published. Refusing to modify it." >&2
                exit 1
              fi
              echo "warning: replacing assets of the published release $TAG (replace_assets=true)" >&2
            fi
            gh release upload "$TAG" "$@" --clobber
          else
            PRERELEASE=""
            case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$TAG" "$@" --draft --verify-tag --title "Ameya $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $PRERELEASE
          fi
