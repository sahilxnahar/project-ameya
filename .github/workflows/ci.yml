name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle (universal)
        run: ./scripts/build-app.sh

      - name: Self-test inside the sandbox
        run: dist/Ameya.app/Contents/MacOS/Ameya --self-test

      - name: Package
        run: ditto -c -k --keepParent dist/Ameya.app dist/Ameya.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ameya-${{ github.sha }}
          path: dist/Ameya.zip
          retention-days: 14
